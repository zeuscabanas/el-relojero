  $('u').innerHTML = '<section class="w"><h2>Usuarios<small>' + US.length + ' cuentas · ' + US.filter(x => x.verificado).length + ' verificadas</small></h2><input id="uf" placeholder="Buscar por nombre o correo" value="' + esc(f) + '"><div id="um"></div><div class="tw"><table><tr><th>Nombre</th><th>Correo</th><th>Verificado</th><th>Alta</th><th>Última entrada</th><th>Skins</th><th>Dar o quitar</th></tr>' + L.slice(0, UN).map(x => '<tr><td><b>' + esc(x.nombre) + '</b></td><td>' + esc(x.correo || '') + '</td><td>' + (x.verificado ? '<span class="ok">sí</span>' : 'no') + '</td><td>' + fecha(x.creado) + '</td><td>' + (x.ultima ? fecha(x.ultima) : '') + '</td><td>' + (x.skins.map(k => esc(SKINS[k] || k)).join(', ') || '–') + '</td><td>' + Object.keys(SKINS).map(k => x.skins.includes(k) ? '<button class="q" data-n="' + esc(x.nombre) + '" data-s="' + k + '" data-d="0">Quitar ' + esc(SKINS[k]) + '</button>' : '<button data-n="' + esc(x.nombre) + '" data-s="' + k + '" data-d="1">Dar ' + esc(SKINS[k]) + '</button>').join('') + '</td></tr>').join('') + '</table></div>' + (L.length > UN ? '<p class="vac">Se muestran ' + UN + ' de ' + L.length + '. Usa el buscador para acotar, o <button id="umas">ver 50 más</button></p>' : '') + (US.length ? '' : '<p class="vac">Todavía no se ha registrado nadie.</p>') + '</section>'; if ($('umas')) $('umas').onclick = () => { UN += 50; pintaU(); }; const i = $('uf'); i.oninput = () => { const p = i.selectionStart; pintaU(); $('uf').focus(); $('uf').setSelectionRange(p, p); }; }
async function cargaU() { try { US = await rpc('admin_usuarios'); pintaU(); } catch (e) { $('u').innerHTML = '<p class="vac">No se han podido cargar los usuarios: ' + esc(e.message) + '</p>'; } }
$('u').addEventListener('click', async e => { const b = e.target.closest('button[data-n]'); if (!b) return; b.disabled = true; try { await rpc('admin_skin', { nombre: b.dataset.n, skin: b.dataset.s, dar: b.dataset.d === '1' }); await cargaU(); $('um').textContent = (b.dataset.d === '1' ? 'Skin dada a ' : 'Skin quitada a ') + b.dataset.n + '. La verá la próxima vez que abra el juego.'; } catch (er) { b.disabled = false; $('um').textContent = 'No se ha podido: ' + er.message; } });
const tab = w => { $('m').hidden = w !== 's'; $('u').hidden = w !== 'u'; $('tS').classList.toggle('on', w === 's'); $('tU').classList.toggle('on', w === 'u'); if (w === 'u') cargaU(); }; $('tS').onclick = () => tab('s'); $('tU').onclick = () => tab('u');
try { const k = sessionStorage.getItem('relojero_stats'); if (k) carga(k); } catch (e) {}
</script></body></html>
