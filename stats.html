<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>El relojero · estadísticas</title>
<style>
  :root { --bg: #14100e; --card: #211914; --line: #4a3820; --tx: #f3e6cb; --mu: #b3a184; --ac: #ffcf6e; --bar: #c8862a; --bad: #d9603f; }
  * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 Georgia, 'Times New Roman', serif; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 22px 26px 6px; } h1 { margin: 0; font-size: 26px; color: var(--ac); letter-spacing: 1px; } header span { color: var(--mu); font-size: 13px; } header #tS { margin-left: auto; } .tb.on { border-color: var(--ac); color: var(--ac); } td button { padding: 2px 10px; font-size: 12px; margin-right: 4px; } td button.q { border-color: var(--bad); } .ok { color: #9fd08a; } #um { color: var(--ac); font-size: 13px; min-height: 18px; margin: 6px 0; } #uf { padding: 7px 10px; background: #120d0b; color: var(--tx); border: 1px solid #8a6a2c; border-radius: 6px; width: 260px; }
  main { padding: 10px 26px 60px; max-width: 1200px; } h2 { font-size: 17px; color: var(--ac); margin: 0 0 10px; letter-spacing: .5px; } h2 small { color: var(--mu); font-size: 12px; font-weight: normal; margin-left: 8px; }
  .kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 10px 0 18px; } .kp div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; } .kp b { display: block; font-size: 30px; color: #fff3d6; line-height: 1.1; } .kp span { color: var(--mu); font-size: 12.5px; }
  .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; } section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; } section.w { grid-column: 1 / -1; }
  .br { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 54px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13.5px; } .br i { display: block; height: 14px; border-radius: 3px; background: var(--bar); min-width: 2px; } .br.d i { background: var(--bad); } .br span:last-child { text-align: right; color: #fff3d6; } .br em { color: var(--mu); font-style: normal; font-size: 12px; }
  .tw { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 13px; } th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid #33271a; white-space: nowrap; } th { color: var(--mu); font-weight: normal; font-size: 12px; } td.n, th.n { text-align: right; }
  .op { border-bottom: 1px solid #33271a; padding: 10px 0; } .op:last-child { border: 0; } .op b { color: var(--ac); } .op small { color: var(--mu); margin-left: 8px; } .op p { margin: 4px 0 0; white-space: pre-wrap; } .op p span { color: var(--mu); font-size: 12px; display: block; }
  .vac { color: var(--mu); font-size: 13.5px; } button, input { font: inherit; } button { background: #3a2a18; color: var(--tx); border: 1px solid #8a6a2c; border-radius: 6px; padding: 6px 14px; cursor: pointer; } button:hover { border-color: var(--ac); }
  #login { max-width: 380px; margin: 16vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 24px; text-align: center; } #login input { width: 100%; margin: 12px 0; padding: 9px 10px; background: #120d0b; color: var(--tx); border: 1px solid #8a6a2c; border-radius: 6px; } #err { color: var(--bad); min-height: 20px; font-size: 13px; }
</style></head><body>
<div id="login"><h1>El relojero</h1><p class="vac">Estadísticas de la demo. Pide la clave a César.</p><form id="f"><input id="k" type="password" placeholder="Clave" autocomplete="current-password"><button>Entrar</button></form><div id="err"></div></div>
<div id="app" hidden><header><h1>El relojero · administración</h1><span id="sub"></span><button id="tS" class="tb on">Estadísticas</button><button id="tU" class="tb">Usuarios y skins</button><button id="re">Actualizar</button><button id="out">Salir</button></header><main id="m"></main><main id="u" hidden></main></div>
<script>
const URL_ = 'https://ausijsdtbermhxvnfgrg.supabase.co/rest/v1/rpc/stats', KEY = 'sb_publishable_3_B41XaoIde_cz1TOSy8UA_VrF1UxQa', $ = id => document.getElementById(id);
const SALAS = ['Garaje', 'Sala de calderas', 'Cámara del Regulador', 'Plaza del reloj', 'Nido', 'Tejados', 'Fragua'], esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const HITO = { start: 'Abren la página', new: 'Empiezan partida nueva', tut_fin: 'Terminan el tutorial', end: 'Terminan la demo', fb: 'Envían opinión' }, sala = i => SALAS[i] || ('Sala ' + i), fecha = t => new Date(t).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const hito = h => { const [e, k] = h.split(':'); if (HITO[h]) return HITO[h]; if (e === 'st') return 'Encienden la estación ' + k; if (e === 'boss') return 'Vencen a: ' + k; if (e === 'item') return 'Consiguen: ' + k.replace(/_/g, ' '); if (e === 'fb') return 'Opinan con un ' + k; return h; };
const bars = (rows, lab, val, cls, extra) => { const mx = Math.max(1, ...rows.map(val)); return rows.length ? rows.map(r => '<div class="br ' + (cls || '') + '"><span>' + esc(lab(r)) + (extra ? ' <em>' + esc(extra(r)) + '</em>' : '') + '</span><i style="width:' + (val(r) / mx * 100).toFixed(1) + '%"></i><span>' + val(r) + '</span></div>').join('') : '<p class="vac">Todavía no hay datos.</p>'; };
function pinta(d) { const T = d.total, S = d.sesiones, jug = T.jugadores || 0, emp = new Set(S.filter(s => s.partida_nueva).map(s => s.jugador)).size, fin = new Set(S.filter(s => s.terminado).map(s => s.jugador)).size, mins = S.filter(s => s.minutos > 0).map(s => +s.minutos).sort((a, b) => a - b), med = mins.length ? mins[mins.length >> 1] : 0, notas = d.opiniones.filter(o => o.nota).map(o => o.nota), nm = notas.length ? (notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(1) : '–';
  $('sub').textContent = T.desde ? 'Desde el ' + fecha(T.desde) + ' · ' + T.eventos + ' eventos' : 'Sin datos todavía';
  let h = '<div class="kp"><div><b>' + jug + '</b><span>jugadores distintos</span></div><div><b>' + T.sesiones + '</b><span>sesiones</span></div><div><b>' + emp + '</b><span>empiezan partida</span></div><div><b>' + fin + '</b><span>terminan la demo</span></div><div><b>' + med + '</b><span>minutos jugados (mediana)</span></div><div><b>' + nm + '</b><span>nota media (' + notas.length + ' opiniones)</span></div></div><div class="g">';
  h += '<section><h2>Hasta dónde llegan<small>jugadores que alcanzan cada hito</small></h2>' + bars(d.embudo, r => hito(r.hito), r => r.jugadores, '', r => r.minuto_medio > 0 ? 'min ' + r.minuto_medio : '') + '</section>';
  h += '<section><h2>Salas visitadas<small>jugadores que han estado en cada una</small></h2>' + bars(d.salas, r => sala(r.sala), r => r.jugadores) + '</section>';
  h += '<section><h2>Dónde mueren<small>veces, por sala y causa</small></h2>' + bars(d.muertes, r => sala(r.sala), r => r.muertes, 'd', r => r.causa + ' · ' + r.jugadores + ' jug.') + '</section>';
  h += '<section><h2>De dónde vienen<small>enlace o parámetro ?src=</small></h2>' + bars(d.origen, r => r.origen, r => r.jugadores) + '</section>';
  h += '<section class="w"><h2>Por día</h2><div class="tw"><table><tr><th>Día</th><th class="n">Jugadores</th><th class="n">Sesiones</th><th class="n">Empiezan</th><th class="n">Terminan</th><th class="n">Min. (media)</th><th class="n">Min. (mediana)</th><th class="n">Muertes (media)</th></tr>' + d.dias.map(r => '<tr><td>' + esc(r.dia) + '</td><td class="n">' + r.jugadores + '</td><td class="n">' + r.sesiones + '</td><td class="n">' + r.empiezan + '</td><td class="n">' + r.terminan + '</td><td class="n">' + (r.minutos_media ?? '') + '</td><td class="n">' + (r.minutos_mediana ?? '') + '</td><td class="n">' + (r.muertes_media ?? '') + '</td></tr>').join('') + '</table></div></section>';
  h += '<section class="w"><h2>Opiniones<small>' + d.opiniones.length + '</small></h2>' + (d.opiniones.length ? d.opiniones.map(o => '<div class="op"><b>' + (o.nota ? '⚙'.repeat(o.nota) + ' ' + o.nota + '/5' : 'Sin nota') + '</b><small>' + fecha(o.ts) + (o.stats ? ' · ' + (o.stats.min ?? '?') + ' min · ' + (o.stats.muertes ?? 0) + ' muertes · ' + sala(o.stats.sala) + (o.stats.fin ? ' · terminó' : '') + ' · ' + esc(o.stats.lang || '') : '') + '</small>' + (o.gusto ? '<p><span>Le gustó</span>' + esc(o.gusto) + '</p>' : '') + (o.cambiaria ? '<p><span>Cambiaría</span>' + esc(o.cambiaria) + '</p>' : '') + '</div>').join('') : '<p class="vac">Todavía no ha opinado nadie.</p>') + '</section>';
  h += '<section class="w"><h2>Últimas sesiones<small>hasta 300</small></h2><div class="tw"><table><tr><th>Inicio</th><th>Jugador</th><th>Viene de</th><th>Idioma</th><th class="n">Min.</th><th class="n">Salas</th><th class="n">Estaciones</th><th class="n">Jefes</th><th class="n">Muertes</th><th>Terminó</th><th>Táctil</th></tr>' + S.map(r => '<tr><td>' + fecha(r.inicio) + '</td><td>' + esc(String(r.jugador).slice(0, 6)) + '</td><td>' + esc(r.viene_de || '') + '</td><td>' + esc(r.idioma || '') + '</td><td class="n">' + (r.minutos ?? 0) + '</td><td class="n">' + r.salas + '</td><td class="n">' + r.estaciones + '</td><td class="n">' + r.jefes + '</td><td class="n">' + r.muertes + '</td><td>' + (r.terminado ? 'sí' : '') + '</td><td>' + (r.tactil ? 'sí' : '') + '</td></tr>').join('') + '</table></div></section></div>';
  $('m').innerHTML = h; }
async function carga(k) { $('err').textContent = ''; try { const r = await fetch(URL_, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ clave: k }) }); if (!r.ok) throw new Error(r.status === 400 ? 'Clave incorrecta.' : 'No se han podido cargar los datos (' + r.status + ').'); const d = await r.json(); try { sessionStorage.setItem('relojero_stats', k); } catch (e) {} $('login').hidden = true; $('app').hidden = false; pinta(d); } catch (e) { $('app').hidden = true; $('login').hidden = false; $('err').textContent = e.message; } }
$('f').onsubmit = e => { e.preventDefault(); carga($('k').value.trim()); }; $('re').onclick = () => { carga(sessionStorage.getItem('relojero_stats')); if (!$('u').hidden) cargaU(); }; $('out').onclick = () => { try { sessionStorage.removeItem('relojero_stats'); } catch (e) {} location.reload(); };
const RPC = 'https://ausijsdtbermhxvnfgrg.supabase.co/rest/v1/rpc/', SKINS = { escarcha: 'Guardián de la escarcha' }, clave = () => sessionStorage.getItem('relojero_stats'), rpc = (f, b) => fetch(RPC + f, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ clave: clave() }, b || {})) }).then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status); return r.json(); });
let US = [];
function pintaU() { const f = ($('uf') ? $('uf').value : '').toLowerCase(), L = US.filter(x => !f || x.nombre.toLowerCase().includes(f) || (x.correo || '').toLowerCase().includes(f));
  $('u').innerHTML = '<section class="w"><h2>Usuarios<small>' + US.length + ' cuentas · ' + US.filter(x => x.verificado).length + ' verificadas</small></h2><input id="uf" placeholder="Buscar por nombre o correo" value="' + esc(f) + '"><div id="um"></div><div class="tw"><table><tr><th>Nombre</th><th>Correo</th><th>Verificado</th><th>Alta</th><th>Última entrada</th><th>Skins</th><th>Dar o quitar</th></tr>' + L.map(x => '<tr><td><b>' + esc(x.nombre) + '</b></td><td>' + esc(x.correo || '') + '</td><td>' + (x.verificado ? '<span class="ok">sí</span>' : 'no') + '</td><td>' + fecha(x.creado) + '</td><td>' + (x.ultima ? fecha(x.ultima) : '') + '</td><td>' + (x.skins.map(k => esc(SKINS[k] || k)).join(', ') || '–') + '</td><td>' + Object.keys(SKINS).map(k => x.skins.includes(k) ? '<button class="q" data-n="' + esc(x.nombre) + '" data-s="' + k + '" data-d="0">Quitar ' + esc(SKINS[k]) + '</button>' : '<button data-n="' + esc(x.nombre) + '" data-s="' + k + '" data-d="1">Dar ' + esc(SKINS[k]) + '</button>').join('') + '</td></tr>').join('') + '</table></div>' + (US.length ? '' : '<p class="vac">Todavía no se ha registrado nadie.</p>') + '</section>'; const i = $('uf'); i.oninput = () => { const p = i.selectionStart; pintaU(); $('uf').focus(); $('uf').setSelectionRange(p, p); }; }
async function cargaU() { try { US = await rpc('admin_usuarios'); pintaU(); } catch (e) { $('u').innerHTML = '<p class="vac">No se han podido cargar los usuarios: ' + esc(e.message) + '</p>'; } }
$('u').addEventListener('click', async e => { const b = e.target.closest('button[data-n]'); if (!b) return; b.disabled = true; try { await rpc('admin_skin', { nombre: b.dataset.n, skin: b.dataset.s, dar: b.dataset.d === '1' }); await cargaU(); $('um').textContent = (b.dataset.d === '1' ? 'Skin dada a ' : 'Skin quitada a ') + b.dataset.n + '. La verá la próxima vez que abra el juego.'; } catch (er) { b.disabled = false; $('um').textContent = 'No se ha podido: ' + er.message; } });
const tab = w => { $('m').hidden = w !== 's'; $('u').hidden = w !== 'u'; $('tS').classList.toggle('on', w === 's'); $('tU').classList.toggle('on', w === 'u'); if (w === 'u') cargaU(); }; $('tS').onclick = () => tab('s'); $('tU').onclick = () => tab('u');
try { const k = sessionStorage.getItem('relojero_stats'); if (k) carga(k); } catch (e) {}
</script></body></html>
